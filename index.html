const STORAGE='pokelogica-academia-v1';
const defaults=()=>({started:false,name:'',classroom:'',partner:0,gym:0,phase:0,slide:0,xp:0,badges:[],unlocked:Array(6).fill(0),trained:Array(6).fill(0),experimentDone:Array(6).fill(false),experimentCount:Array(6).fill(0),mistakes:0,history:[],bosses:{},created:new Date().toISOString()});
let state=defaults();try{const s=JSON.parse(localStorage.getItem(STORAGE));if(s&&Array.isArray(s.badges)&&Array.isArray(s.trained)&&s.trained.length===6){state={...defaults(),...s}}}catch(e){}
let msg=null,answerErrors=0;
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase().replace(/\s+/g,' ').replace(/\s*,\s*/g,',');
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}}
function selectedPartner(){return partners[state.partner]||partners[0]}
function award(amount){state.xp+=amount}
function setMessage(text,type='bad'){msg={text,type}}
function feedbackHTML(){return msg?`<div class="feedback ${msg.type}" role="status">${safe(msg.text)}</div>`:''}
function codeBlock(code,label='PORTUGOL • EXEMPLO'){return `<div class="codebox"><div class="codehead"><span>${safe(label)}</span><span>⌘</span></div><pre>${safe(code)}</pre><div class="codecaption">${label.includes("PASSOS")||label.includes("SIMULAÇÃO")||code.includes("procedimento anunciar()")?"Representação didática para visualizar a lógica.":"Exemplo de sintaxe do Portugol Studio; alguns trechos são isolados para facilitar a leitura."}</div></div>`}
function renderSidebar(){const p=selectedPartner();document.getElementById('sidebar').innerHTML=`<div class="brand"><div class="ball"></div><div><div class="brandstrong">PokéLógica</div><small>Academia de algoritmos</small></div></div>${state.started?`<div class="sidecard"><div class="small">Treinador(a)</div><div class="trainer-name">${safe(state.name||'Treinador(a)')} ${safe(p.emoji)}</div><div class="xp">★ ${state.xp} XP • ${state.badges.length}/6 insígnias</div><div class="xpbar"><span style="width:${Math.min(100,state.badges.length/6*100)}%"></span></div></div><div class="side-label">Mapa das academias</div><nav class="gym-nav" aria-label="Missões">${gyms.map((g,i)=>{const done=state.badges.includes(i),locked=i>state.badges.length;return `<button class="gym-button ${state.gym===i?'active':''} ${done?'done':''}" data-action="goto" data-gym="${i}" ${locked?'disabled':''}><span class="gym-icon">${done?'✅':locked?'🔒':g.icon}</span><span><strong>${i+1}. ${safe(g.topic)}</strong><small>${done?'Insígnia conquistada':locked?'Bloqueado':i===state.gym?'Em andamento':'Disponível'}</small></span></button>`}).join('')}</nav><div class="sidebar-foot">🔒 As próximas academias são liberadas ao concluir a missão atual.<button class="side-reset" data-action="reset">↻ Reiniciar toda a jornada</button></div>`:`<div class="sidecard"><div class="small">Sua jornada começa aqui</div><div class="trainer-name">Escolha seu Pokémon!</div><div class="xp">★ Seis insígnias para conquistar</div></div><p class="sidebar-foot">Jogável offline, no computador ou no celular.</p>`}`}
function renderTopbar(){const g=gyms[state.gym];document.getElementById('topbar').innerHTML=`<div class="crumb">${state.started?`${g?`INÍCIO / ACADEMIA ${state.gym+1} / ${safe(g.topic.toUpperCase())}`:"INÍCIO / LIGA DOS ALGORITMOS"}`:'INÍCIO / CRIAR TREINADOR'}</div><div class="top-status">⚡ <span>${state.xp} XP</span> <span style="color:#bbc4d4">|</span> 🏅 ${state.badges.length}/6</div>`}
function renderWelcome(){document.getElementById('screen').innerHTML=`<section class="introhero"><div class="hero-decor">◉</div><span class="eyebrow">🎮 APRENDA JOGANDO • PORTUGOL</span><h1>Sua jornada para dominar os <em>algoritmos!</em></h1><p>Seja um treinador de lógica: resolva mistérios, programe caminhos, organize Pokémons e ganhe 6 insígnias. <strong>Não precisa saber programar para começar.</strong></p><div class="mini-stats"><span>📘 Tutoriais explicados</span><span>🧩 24 exercícios</span><span>🎯 6 jogos práticos</span></div></section><h2 class="section-title">1. Quem é o treinador?</h2><div class="card"><div class="setupgrid"><label class="field">Nome do aluno ou dupla<input id="studentName" placeholder="Ex.: Ana e Pedro" maxlength="60" value="${safe(state.name)}"></label><label class="field">Turma (opcional)<input id="classroom" placeholder="Ex.: 101" maxlength="30" value="${safe(state.classroom)}"></label></div></div><h2 class="section-title">2. Escolha seu parceiro inicial</h2><div class="partners">${partners.map((p,i)=>`<button class="partner ${state.partner===i?'selected':''}" data-action="partner" data-id="${i}" aria-pressed="${state.partner===i}"><span class="emoji">${p.emoji}</span><strong>${p.name}</strong><small>Tipo ${p.type}</small></button>`).join('')}</div><div class="help-note">👩‍🏫 <strong>Como funciona:</strong> em cada academia você vai <strong>aprender</strong> com exemplos, <strong>experimentar</strong>, fazer <strong>4 treinos</strong> e vencer <strong>1 missão prática</strong>. A página salva o progresso neste navegador.</div><div style="margin-top:23px;display:flex;justify-content:flex-end"><button class="btn btn-primary" data-action="start">Começar minha jornada →</button></div>`}
function hero(){const g=gyms[state.gym];return `<section class="gymhero"><div><div class="no">ACADEMIA ${state.gym+1} DE 6 · ${safe((g?.topic||'Liga dos Algoritmos').toUpperCase())}</div><h1>${safe(g.name)}</h1><p>${safe(g.goal)}</p></div><span class="mascot" aria-hidden="true">${g.mascot}</span></section>`}
const phaseNames=['1. Aprender','2. Experimentar','3. Treinar','4. Missão'];
function steps(){return `<nav class="stepper" aria-label="Etapas da academia">${phaseNames.map((n,i)=>`<button class="step ${state.phase===i?'active':''} ${state.unlocked[state.gym]>i?'complete':''}" data-action="phase" data-phase="${i}" ${state.unlocked[state.gym]<i?'disabled':''}><span class="index">${state.unlocked[state.gym]>i?'✓':i+1}</span>${n}</button>`).join('')}</nav>`}
function visualFor(id){if(id==='flow')return '<div class="flowline"><span>📦 Preparar</span><i>→</i><span>🚶 Aproximar</span><i>→</i><span>🎯 Lançar</span></div>';
if(id==='console')return '<div class="console">&gt; Preparar!<br>&gt; Lançar Pokébola!<br>&gt; Captura concluída!</div>';
if(id==='arrows')return '<div class="flowline"><span>🚶 Início</span><i>↓</i><span>⬇️</span><i>↓</i><span>➡️</span><i>→</i><span>🏆</span></div>';
if(id==='branch')return '<div class="flowline"><span>❤️ energia &lt; 40?</span><i>↗</i><span>✅ Poção</span><i>↘</i><span>❌ Batalha</span></div>';
if(id==='stats')return '<div class="flowline"><span>❤️ 39 = poção</span><span>❤️ 40 = batalha</span><span>❤️ 41 = batalha</span></div>';

function renderLearn(){const g=gyms[state.gym],s=g.slides[state.slide];return `${hero()}${steps()}<div class="layout2"><article class="card"><div class="kicker">PASSO ${state.slide+1} DE ${g.slides.length} • APRENDA SEM PRESSA</div><h2 class="section-title" style="margin:11px 0 15px">${safe(s.title)}</h2><div class="lesson-prose">${s.paragraphs.map(p=>`<p>${p}</p>`).join('')}</div><div class="coach"><span class="coach-icon">💡</span><div><strong>Dica do Professor Oak</strong><br>${safe(s.tip)}</div></div><div class="lessonnav"><button class="btn btn-outline btn-small" data-action="slideprev" ${state.slide===0?'disabled':''}>← Voltar</button><div class="dots" aria-label="Progresso da explicação">${g.slides.map((_,i)=>`<span class="${i===state.slide?'on':''}"></span>`).join('')}</div><button class="btn btn-primary" data-action="slidenext">${state.slide===g.slides.length-1?'Entendi, quero experimentar →':'Próxima explicação →'}</button></div></article><aside class="card"><div class="subhead">VEJA NA PRÁTICA</div><div class="lesson-visual">${visualFor(s.visual)}</div><div class="subhead" style="margin-top:23px">EXEMPLO COMENTADO</div>${codeBlock(s.code,s.visual==='flow'||s.visual==='arrows'?'PASSOS DO ALGORITMO':'PORTUGOL • EXEMPLO')}<div class="notice">Não precisa decorar: entenda o que cada comando faz.</div></aside></div>`}

if(i===3){const r=state.demoMatrix?.r??0,c=state.demoMatrix?.c??0;return `<div class="interact-box"><h3 class="interact-title">🗺️ Explore o mapa por coordenadas</h3><p class="interact-desc">Clique em uma casa e observe o código correspondente: <strong>mapa[linha][coluna]</strong>.</p>${miniMatrix(r,c,'demo-matrix')}<div class="smallcode">Casa selecionada: mapa[${r}][${c}]<br>linha = ${r} | coluna = ${c}</div></div>`}
if(i===4){const p=state.demoPower??12,b=state.demoBonus??5;return `<div class="interact-box"><h3 class="interact-title">⚙️ Faça a função trabalhar</h3><p class="interact-desc">Mude os números. A função executa o mesmo cálculo com entradas diferentes.</p><label class="field" style="margin:14px 0">Poder: <strong>${p}</strong><input type="range" min="1" max="50" value="${p}" id="demoPower" data-demo-range="power"></label><label class="field" style="margin:14px 0">Bônus: <strong>${b}</strong><input type="range" min="0" max="30" value="${b}" id="demoBonus" data-demo-range="bonus"></label><div class="smallcode">dano(${p}, ${b}) → retorne ${p} + ${b}</div><div class="feedback good">📤 A função devolveu <strong>${p+b}</strong> pontos de dano!</div><div class="interact-actions"><button class="btn btn-primary" data-action="demo-func">Testei a função ✓</button></div></div>`}
if(i===5){const h=state.demoLife??30,log=state.demoConsole||[];return `<div class="interact-box"><h3 class="interact-title">📟 Chame procedimentos diferentes</h3><p class="interact-desc">Os botões <strong>executam ações</strong>. Veja os resultados no console e na energia do Pokémon.</p><div class="battlerow"><span class="creature-big">${selectedPartner().emoji}</span><div style="flex:1"><strong>${selectedPartner().name}</strong><div>❤️ Vida: ${h}/100</div><div class="stat-meter"><span style="width:${h}%"></span></div></div></div><div class="interact-actions"><button class="btn btn-outline" data-action="demo-proc" data-val="anunciar">📣 anunciar()</button><button class="btn btn-primary" data-action="demo-proc" data-val="curar">💚 curar()</button><button class="btn btn-outline" data-action="demo-reset">↻ Recomeçar</button></div><div class="console" style="margin-top:14px">${log.length?log.map(safe).join('<br>'):'<span class="dim">As ações aparecerão aqui.</span>'}</div></div>`}return ''}
function renderExperiment(){const g=gyms[state.gym],i=state.gym,done=state.experimentDone[i];return `${hero()}${steps()}<div class="layout2"><div class="card"><div class="kicker">EXPERIMENTO INTERATIVO</div><h2 class="section-title" style="margin:12px 0">Agora você controla!</h2><p class="lesson-prose">${safe(g.summary)} Clique, mude os valores e <strong>observe o que acontece</strong>. Não há resposta errada nesta etapa!</p>${experimentContent(i)}${feedbackHTML()}<div class="lessonnav"><button class="btn btn-outline" data-action="phase" data-phase="0">← Rever a explicação</button><button class="btn btn-primary" data-action="complete-experiment" ${(state.experimentCount[i]||0)<1?'disabled':''}>${done?'Ir aos 4 treinos →':'Entendi! Vamos treinar →'}</button></div></div><aside class="card"><div class="subhead">POR QUE ISSO IMPORTA?</div><h3>Aprender antes de decorar</h3><p class="lesson-prose">Primeiro você vê o programa funcionando. Depois você vai prever resultados, completar comandos e enfrentar um desafio.</p><div class="coach"><span class="coach-icon">🧠</span><div>Experimente mudar mais de uma vez. Um bom programador testa diferentes possibilidades.</div></div><div class="help-note">🎯 <strong>Objetivo:</strong> fazer pelo menos uma interação para desbloquear os treinos.</div></aside></div>`}

function tinyMap(robot,trace=[]){const rocks=new Set(['1,1','2,1','3,1','0,3','2,3']);let html='<div class="gridmap" aria-label="Mapa 5 por 5">';for(let r=0;r<5;r++)for(let c=0;c<5;c++){const k=r+','+c,rock=rocks.has(k),goal=r===4&&c===4,me=robot&&robot[0]===r&&robot[1]===c;html+=`<div class="tile ${rock?'rock':''} ${goal?'goal':''} ${me?'robot':''} ${trace.includes(k)?'visited':''}" title="Linha ${r} coluna ${c}">${me?'🧑‍🎓':rock?'🪨':goal?'🏆':'🌿'}</div>`}return html+'</div>'}
function miniMatrix(r0,c0,action,targets){let h='<div class="gridmap" style="max-width:360px" aria-label="Mapa quatro por quatro com índices">';for(let r=-1;r<4;r++)for(let c=-1;c<4;c++){if(r===-1||c===-1){h+=`<div class="tile coordinate ${r===-1&&c===-1?'corner':''}">${r===-1&&c===-1?'↘':r===-1?c:r}</div>`;continue}let is=r===r0&&c===c0,loc=targets?.[r+','+c];h+=`<button class="tile ${is?'target':''}" data-action="${action}" data-r="${r}" data-c="${c}" aria-label="Linha ${r}, coluna ${c}">${loc||'🌿'}</button>`}return h+'</div>'}

if(i===4){const round=b.round||0,t=functionTasks[Math.min(round,2)];return `<div class="boss-card"><span class="task-tag">⚡ MISSÃO • CÓDIGO DE VERDADE</span><h3 class="boss-title">${t.title}</h3><p class="lesson-prose">Complete a expressão depois de <strong>retorne</strong>. Seu código será testado com <strong>três entradas diferentes</strong>. Você não precisa escrever a palavra retorne.</p><div class="progress-track"><span style="width:${round/3*100}%"></span></div>${codeBlock(t.code,'PORTUGOL • COMPLETE O RETORNO')}<div class="answer-row"><input id="functionCode" placeholder="Ex.: poder + bonus" value="${safe(b.code||'')}" autocapitalize="off" spellcheck="false"><button class="btn btn-primary" data-action="function-test">▶ Rodar 3 testes</button></div><div class="help-note">🔎 Variáveis disponíveis: <strong>${t.params.join(', ')}</strong>. Operadores permitidos: <strong>+ &nbsp; - &nbsp; * &nbsp; / &nbsp; ( )</strong>.</div>${b.results?`<table class="testtable"><thead><tr><th>Entradas</th><th>Seu resultado</th><th>Esperado</th><th></th></tr></thead><tbody>${b.results.map(x=>`<tr><td>${safe(x.inputs)}</td><td>${safe(x.got)}</td><td>${x.expected}</td><td class="${x.ok?'testpass':'testfail'}">${x.ok?'✓':'✕'}</td></tr>`).join('')}</tbody></table>`:''}${feedbackHTML()}<details class="hintbox"><summary>💡 Dica para este código</summary><p>${safe(t.hint)}</p></details></div>`}
if(i===5){const commands=b.commands||[],names={anunciar:'📣 anunciar()',curar:'💚 curar()',atacar:'⚔️ atacar()'};return `<div class="boss-card"><span class="task-tag">💚 MISSÃO • A BATALHA FINAL</span><h3 class="boss-title">Organize os procedimentos!</h3><p class="lesson-prose">Seu Pokémon está com <strong>20 de energia</strong>. Monte uma sequência de três procedimentos: primeiro anunciar a batalha, depois curar, e somente então atacar. Aqui cada comando <strong>realiza uma ação, sem retornar um valor</strong>.</p><div class="interact-actions">${Object.entries(names).map(([k,n])=>`<button class="btn btn-outline btn-small" data-action="proc-add" data-val="${k}">${n}</button>`).join('')}</div><div class="subhead" style="margin-top:19px">SEU PROGRAMA</div><div class="smallcode">${commands.length?commands.map((k,i)=>`${i+1}. ${names[k]}`).join('<br>'):'Clique nos comandos para montar o seu programa.'}</div><div class="boss-controls"><button class="btn btn-outline" data-action="proc-undo" ${!commands.length?'disabled':''}>↶ Desfazer</button><button class="btn btn-outline" data-action="proc-clear">Limpar</button><button class="btn btn-primary" data-action="proc-run" ${!commands.length?'disabled':''}>▶ Executar os procedimentos</button></div>${b.log?.length?`<div class="console">${b.log.map(safe).join('<br>')}</div>`:''}${feedbackHTML()}</div>`}return ''}
function renderBoss(){const i=state.gym,g=gyms[i],b=ensureBoss(i);return `${hero()}${steps()}<div class="layout2"><section class="card"><div class="kicker">DESAFIO DA INSÍGNIA ${i+1}</div><h2 class="section-title" style="margin:12px 0 15px">Hora de aplicar o que aprendeu!</h2>${bossContent(i,b)}</section><aside class="card"><div class="subhead">MISSÃO ATUAL</div><h3>${safe(g.topic)}</h3><p class="lesson-prose">${safe(g.goal)}</p><div class="coach"><span class="coach-icon">🧩</span><div><strong>Estratégia:</strong> faça uma tentativa, observe o resultado e corrija o que não funcionou. Errar faz parte da programação!</div></div><div class="help-note">🏅 Complete esta missão para ganhar <strong>80 XP</strong>, a insígnia e acesso à próxima academia.</div><button class="btn btn-outline btn-block" data-action="phase" data-phase="0" style="margin-top:15px">📖 Revisar tutorial</button></aside></div>`}
function renderVictory(){const i=state.gym,g=gyms[i],last=i===5;return `${hero()}${steps()}<div class="victory" style="margin-top:22px"><span class="symbol">🏅</span><div class="kicker">INSÍGNIA CONQUISTADA</div><h2>Missão concluída!</h2><p>Você dominou os fundamentos de <strong>${safe(g.topic)}</strong> e completou os 4 exercícios e o desafio prático. +80 XP pela insígnia!</p><div class="badgerow"><span class="earned-badge">${g.icon} ${safe(g.topic)}</span><span class="earned-badge">⭐ ${state.xp} XP</span></div><div class="actions-end"><button class="btn btn-outline" data-action="phase" data-phase="0">📘 Rever o conteúdo</button><button class="btn btn-primary" data-action="next-gym">${last?'🏆 Ver diploma de treinador →':'Ir para a próxima academia →'}</button></div></div>`}
function renderEnd(){const p=selectedPartner();return `<div class="end-screen"><div class="medal">🏆</div><div class="eyebrow">MESTRE DE ALGORITMOS</div><h1>Parabéns, ${safe(state.name||'treinador(a)')}!</h1><p>Você e ${p.name} conquistaram todas as 6 insígnias da Academia PokéLógica. Você praticou sequência, condições, vetores, matrizes, funções e procedimentos.</p><div class="badgerow">${gyms.map(g=>`<span class="earned-badge" style="color:#243057">${g.icon} ${g.topic}</span>`).join('')}</div><div class="mini-stats" style="justify-content:center"><span>🏅 6 insígnias</span><span>⚡ ${state.xp} XP</span><span>🧩 24 treinos</span><span>🎮 6 desafios</span></div><div class="actions-end"><button class="btn btn-yellow" data-action="download-report">⬇ Baixar relatório para entregar</button><button class="btn btn-outline" data-action="print">🖨 Imprimir conquista</button></div><p style="font-size:11px">Os resultados são guardados apenas neste navegador. O arquivo de entrega é criado no seu computador.</p></div><div class="card" style="margin-top:20px"><div class="panel-heading"><span class="number">🎓</span><h2>Você aprendeu!</h2></div><div class="lesson-prose">Um <strong>algoritmo</strong> é uma sequência de passos. <strong>Condições</strong> escolhem caminhos. <strong>Vetores</strong> guardam itens por índice; <strong>matrizes</strong> guardam por linha e coluna. <strong>Funções</strong> podem devolver valores com <strong>retorne</strong>; <strong>procedimentos</strong> executam ações sem devolver valores.</div></div>`}
function parseCalculation(input,vars){
  // Pequeno avaliador aritmético (sem eval/new Function): números, variáveis e + - * / ( ).
  let s=input.trim();if(!s||s.length>120||/[^\w\s\d.+\-*/()]/.test(s))throw Error('Use apenas números, variáveis e operadores +, -, *, /.');
  let tok=s.match(/(?:\d+(?:\.\d+)?)|(?:[A-Za-z_][A-Za-z_0-9]*)|[()+*/-]/g)||[];
  if(tok.join('')!==s.replace(/\s/g,''))throw Error('Há um caractere inválido no código.');
  let k=0;
  function atom(){let t=tok[k++];if(t===undefined)throw Error('Sua expressão está incompleta.');if(t==='('){let v=expr();if(tok[k++]!==')')throw Error('Faltou fechar parênteses.');return v}if(t==='-')return -atom();if(t==='+')return atom();if(/^\d/.test(t))return Number(t);if(/^[A-Za-z_]/.test(t)&&Object.prototype.hasOwnProperty.call(vars,t))return vars[t];throw Error('Variável não reconhecida: '+t)}
  function mult(){let a=atom();while(tok[k]==='*'||tok[k]==='/'){let op=tok[k++],b=atom();a=op==='*'?a*b:a/b}return a}
  function expr(){let a=mult();while(tok[k]==='+'||tok[k]==='-'){let op=tok[k++],b=mult();a=op==='+'?a+b:a-b}return a}
  let result=expr();if(k!==tok.length||!Number.isFinite(result))throw Error('Confira os operadores e parênteses.');return result;
}
function completeExperiment(){let i=state.gym;if(state.experimentCount[i]<1)return;if(!state.experimentDone[i]){state.experimentDone[i]=true;award(15)}state.unlocked[i]=Math.max(state.unlocked[i],2);state.phase=2;msg=null;save();render()}
function markAnswer(value){const i=state.gym,n=state.trained[i],q=gyms[i].questions[n];if(!q)return;let correct=q.type==='choice'?Number(value)===q.answer:q.answer.some(a=>clean(value)===clean(a));if(correct){state.history.push({type:'treino',gym:gyms[i].topic,exercise:n+1,response:String(value),question:q.text});state.trained[i]=n+1;award(10);state.unlocked[i]=Math.max(state.unlocked[i],state.trained[i]>=4?3:2);answerErrors=0;msg=null;save();render()}else{state.mistakes++;answerErrors++;setMessage('Ainda não! '+(answerErrors>=2?q.explain:q.hint)+' Tente novamente.');save();render()}}
function bossError(s){state.mistakes++;setMessage(s);save();render()}
function bossSuccess(){gainGym();render()}
function handleBossAction(action,d){const i=state.gym,b=ensureBoss(i);
if(i===0){if(action==='robot-add'){if(b.moves.length>=24){bossError('Limite de 24 movimentos. Tente criar um caminho menor.');return}b.moves.push(d.val);b.position=[0,0];b.trace=[];msg=null}
if(action==='robot-undo'){b.moves.pop();b.position=[0,0];b.trace=[];msg=null}
if(action==='robot-clear'){b.moves=[];b.position=[0,0];b.trace=[];msg=null}
if(action==='robot-run'){let r=0,c=0,trace=['0,0'],rocks=new Set(['1,1','2,1','3,1','0,3','2,3']);let failure='';for(let j=0;j<b.moves.length;j++){const m=b.moves[j];r+=m==='D'?1:m==='U'?-1:0;c+=m==='R'?1:m==='L'?-1:0;if(r<0||c<0||r>=5||c>=5){failure=`No passo ${j+1}, você saiu do mapa! Ajuste os movimentos.`;r=Math.max(0,Math.min(4,r));c=Math.max(0,Math.min(4,c));break}if(rocks.has(r+','+c)){failure=`No passo ${j+1}, você bateu em uma pedra 🪨. Tente outro caminho.`;break}trace.push(r+','+c)}b.position=[r,c];b.trace=trace;if(!failure&&r===4&&c===4){state.history.push({type:'missao',gym:'Sequência',code:b.moves.join(' ')});bossSuccess();return}bossError(failure||`Seu treinador parou na linha ${r}, coluna ${c}. Continue até o troféu na posição [4][4].`);return}save();render();return}
if(i===1&&action==='battle-pick'){const hps=[25,60,39,80],hp=hps[b.round],expected=hp<40?'potion':'battle';if(d.val!==expected){bossError(`Com energia ${hp}, a condição ${hp} < 40 é ${hp<40?'VERDADEIRA':'FALSA'}. Observe qual ação deve executar.`);return}b.round++;msg=null;if(b.round===4){state.history.push({type:'missao',gym:'Condições',code:'se (energia < 40) { usarPocao() } senao { batalhar() }'});bossSuccess();return}setMessage(`✅ Isso! ${hp} ${hp<40?'é':'não é'} menor que 40. Próximo cenário!`,'good');save();render();return}
if(i===2){if(action==='team-slot'){b.selected=Number(d.val);msg=null;save();render();return}if(action==='team-set'){const needed=b.round===0?{index:1,name:'Charmander'}:{index:2,name:'Eevee'};if(b.selected!==needed.index||d.name!==needed.name){bossError(`Objetivo: mudar o índice [${needed.index}] para ${needed.name}. Você selecionou [${b.selected}] e ${d.name}.`);return}b.team[needed.index]=needed.name;b.round++;setMessage('✅ Certo! Você modificou somente uma posição do vetor.','good');save();render();return}if(action==='team-answer'){if(d.name!=='Charmander'){bossError('equipe[1] é a SEGUNDA posição. Confira a equipe que você montou.');return}state.history.push({type:'missao',gym:'Vetores',code:'equipe[1] = "Charmander"; equipe[2] = "Eevee"; escreva(equipe[1])'});bossSuccess();return}}
if(i===3&&action==='matrix-boss'){const t=targetPoints[b.round],r=Number(d.r),c=Number(d.c);if(r!==t.r||c!==t.c){bossError(`Você clicou em mapa[${r}][${c}]. A missão pede mapa[${t.r}][${t.c}]. Lembre: linha primeiro, coluna depois.`);return}b.round++;if(b.round===3){state.history.push({type:'missao',gym:'Matrizes',code:targetPoints.map(x=>`mapa[${x.r}][${x.c}]`).join(', ')});bossSuccess();return}setMessage('✅ Coordenada certa! Agora encontre o próximo Pokémon.','good');save();render();return}
if(i===4&&action==='function-test'){const input=document.getElementById('functionCode');b.code=(input?.value||'').trim();const t=functionTasks[b.round];let results=[];try{results=t.tests.map(test=>{const {expected,...vars}=test;const v=parseCalculation(b.code,vars);return {inputs:Object.entries(vars).map(([k,n])=>`${k}=${n}`).join(', '),got:String(v),expected,ok:Math.abs(v-expected)<1e-9}})}catch(e){bossError('Não consegui interpretar a expressão: '+e.message+' Exemplo de formato: poder + bonus');return}b.results=results;if(results.every(x=>x.ok)){state.history.push({type:'codigo-funcao',gym:'Funções',challenge:t.title,code:b.code});b.round++;b.code='';b.results=null;if(b.round===3){bossSuccess();return}setMessage('✅ Sua função passou nos 3 testes! Agora uma nova função.','good');save();render();return}bossError('Sua função não passou em todos os testes. Compare seu resultado com o esperado e revise a expressão.');return}
if(i===5){if(action==='proc-add'){if(b.commands.length>=7){bossError('Seu programa já tem muitos comandos. Limpe ou desfaça e tente com três ações.');return}b.commands.push(d.val);msg=null}if(action==='proc-undo'){b.commands.pop();msg=null}if(action==='proc-clear'){b.commands=[];b.log=[];msg=null}if(action==='proc-run'){let h=20,enemy=50,started=false,log=[];for(let c of b.commands){if(c==='anunciar'){log.push('📣 Batalha anunciada!');started=true}else if(c==='curar'){h=Math.min(100,h+40);log.push('💚 Energia restaurada: '+h)}else if(c==='atacar'){enemy=Math.max(0,enemy-30);log.push('⚔️ Ataque! Adversário: '+enemy)}}b.log=log;const good=b.commands.join(',')==='anunciar,curar,atacar';if(good&&started&&h===60&&enemy===20){state.history.push({type:'missao',gym:'Procedimentos',code:b.commands.map(c=>c+'()').join(' → ')});bossSuccess();return}bossError('As ações foram executadas, mas a ordem não cumpriu a missão. Precisa anunciar → curar → atacar, exatamente nessa ordem.');return}save();render();return}
}
function downloadReport(){const lines=['RELATÓRIO DE APRENDIZAGEM • POKÉLÓGICA','Data: '+new Date().toLocaleString('pt-BR'),'Aluno(s): '+(state.name||'Não informado'),'Turma: '+(state.classroom||'Não informada'),'Parceiro: '+selectedPartner().name,'XP: '+state.xp,'Insígnias: '+state.badges.length+'/6','Treinos concluídos: '+state.trained.reduce((a,b)=>a+b,0)+'/24','Tentativas com erros: '+state.mistakes,'','CONTEÚDOS CONCLUÍDOS',...state.badges.map(i=>'- '+gyms[i].topic),'','RESPOSTAS E CÓDIGOS DOS DESAFIOS'];for(const x of state.history){if(x.type==='treino')lines.push('TREINO '+x.gym+' #'+x.exercise+': '+x.question+' | Resposta: '+x.response);else if(x.type==='codigo-funcao')lines.push('FUNÇÃO '+x.challenge+': retorne '+x.code);else if(x.type==='missao')lines.push('MISSÃO '+x.gym+': '+x.code)}lines.push('','Gerado localmente pela Academia PokéLógica.','Este relatório é um registro de atividades, não substitui a avaliação do professor.');const blob=new Blob([lines.join('\r\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='relatorio_pokelogica_'+(state.name||'aluno').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').slice(0,32)+'.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function actionHandler(event){const el=event.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,d=el.dataset; if(el.disabled)return;
if(a==='partner'){state.partner=Number(d.id);save();render();return}
if(a==='start'){state.name=document.getElementById('studentName')?.value.trim()||'Treinador(a)';state.classroom=document.getElementById('classroom')?.value.trim()||'';state.started=true;state.gym=0;state.phase=0;state.slide=0;save();render();window.scrollTo(0,0);return}
if(a==='reset'){if(confirm('Reiniciar a jornada? Isso apagará todo o progresso e a pontuação deste navegador.')){state=defaults();msg=null;answerErrors=0;save();render()}return}
if(a==='goto'){const i=Number(d.gym);if(i>state.badges.length)return;state.gym=i;state.phase=state.badges.includes(i)?3:Math.min(state.unlocked[i],3);state.slide=0;msg=null;save();render();return}
if(a==='phase'){const p=Number(d.phase);if(p>state.unlocked[state.gym])return;state.phase=p;msg=null;answerErrors=0;save();render();return}
if(a==='slideprev'){state.slide=Math.max(0,state.slide-1);save();render();return}
if(a==='slidenext'){if(state.slide<gyms[state.gym].slides.length-1)state.slide++;else{state.unlocked[state.gym]=Math.max(state.unlocked[state.gym],1);state.phase=1;state.slide=0}msg=null;save();render();return}
if(a==='demo-seq'){state.experimentCount[0]=Math.min(3,state.experimentCount[0]+1);save();render();return}
if(a==='demo-hp'){state.demoHp=Number(d.val);state.experimentCount[1]++;save();render();return}
if(a==='demo-slot'){state.demoSlot=Number(d.val);save();render();return}
if(a==='demo-set'){if(!state.demoTeam)state.demoTeam=['Pikachu','Bulbasaur','Squirtle'];state.demoTeam[Number(state.demoSlot||0)]=d.name;state.experimentCount[2]++;save();render();return}
if(a==='demo-matrix'){state.demoMatrix={r:Number(d.r),c:Number(d.c)};state.experimentCount[3]++;save();render();return}
if(a==='demo-func'){state.experimentCount[4]++;save();render();return}
if(a==='demo-proc'){if(!state.demoConsole)state.demoConsole=[];if(d.val==='curar'){state.demoLife=Math.min(100,(state.demoLife??30)+30);state.demoConsole.push('💚 curar() aumentou a energia para '+state.demoLife)}else state.demoConsole.push('📣 anunciar() mostrou a mensagem de boas-vindas');state.experimentCount[5]++;save();render();return}
if(a==='demo-reset'){if(state.gym===0)state.experimentCount[0]=0;if(state.gym===5){state.demoLife=30;state.demoConsole=[]}save();render();return}
if(a==='complete-experiment'){completeExperiment();return}
if(a==='answer-choice'){markAnswer(d.val);return}
if(a==='answer-input'){markAnswer(document.getElementById('answerInput')?.value||'');return}
if(['robot-add','robot-undo','robot-clear','robot-run','battle-pick','team-slot','team-set','team-answer','matrix-boss','function-test','proc-add','proc-undo','proc-clear','proc-run'].includes(a)){handleBossAction(a,d);return}
if(a==='next-gym'){const next=state.gym+1;if(next===6){state.gym=6;state.phase=0}else{state.gym=next;state.phase=0;state.slide=0}msg=null;save();render();window.scrollTo(0,0);return}
if(a==='download-report'){downloadReport();return}
if(a==='print'){window.print();return}
}
document.addEventListener('click',actionHandler);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target?.id==='answerInput'){e.preventDefault();markAnswer(e.target.value)}if(e.key==='Enter'&&e.target?.id==='functionCode'){e.preventDefault();handleBossAction('function-test',{})}});
document.addEventListener('input',e=>{if(e.target?.dataset?.demoRange){const k=e.target.dataset.demoRange;state[k==='power'?'demoPower':'demoBonus']=Number(e.target.value);state.experimentCount[4]++;save();render()}});
// Corrige um progresso antigo ou incompleto carregado neste navegador.
if(state.gym>6||state.gym<0)state.gym=0;
if(state.gym===6&&state.badges.length<6)state.gym=state.badges.length;
render();
</script>
