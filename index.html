return `<svg class="mon" ${size?`style="${size}"`:''} viewBox="0 0 100 120" role="img" aria-label="Jigglypuff"><ellipse cx="50" cy="74" rx="40" ry="39" fill="#f7bdd8" stroke="#bc85a2" stroke-width="3"/><path d="M16 53L13 19 37 40M68 40L87 19 84 54" fill="#f7bdd8" stroke="#bc85a2" stroke-width="3"/><path d="M26 33Q33 13 55 24Q70 31 53 39Q35 48 41 29" fill="#e9a1c4" stroke="#bc85a2" stroke-width="2"/><ellipse cx="36" cy="67" rx="7" ry="9" fill="#3f7892"/><ellipse cx="65" cy="67" rx="7" ry="9" fill="#3f7892"/><circle cx="38" cy="63" r="2.5" fill="white"/><circle cx="67" cy="63" r="2.5" fill="white"/><path d="M46 83Q51 88 56 83" fill="none" stroke="#a16d8e" stroke-width="2.5"/><ellipse cx="30" cy="107" rx="12" ry="7" fill="#f7bdd8" stroke="#bc85a2" stroke-width="2"/><ellipse cx="70" cy="107" rx="12" ry="7" fill="#f7bdd8" stroke="#bc85a2" stroke-width="2"/></svg>`;}
function toast(msg){document.getElementById('toastArea').innerHTML=`<div class="toast">${msg}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toastArea').innerHTML='',2700)}
function confetti(){const holder=document.createElement('div');holder.className='confetti';for(let i=0;i<38;i++){const el=document.createElement('i');el.style.left=(Math.random()*100)+'%';el.style.background=['#ffd460','#69b98f','#ff867d','#78b8ef','#b495ed'][i%5];el.style.animationDelay=(Math.random()*.5)+'s';holder.append(el)}document.body.append(holder);setTimeout(()=>holder.remove(),2100)}
function win(id,msg){if(!s.awards.includes(id)){s.awards.push(id);s.stars+=10;confetti();toast('⭐ +10 estrelas! '+msg);save()}else toast('👏 '+msg)}

function renderStart(){return `<section class="hero"><div><div class="eyebrow">🎮 Uma aventura para quem nunca programou</div><h1>Aprenda brincando<br>com Pokémon!</h1><p>Comece brincando com Pokémon, aprenda comandos em português e descubra como criar códigos reais em JavaScript.</p></div><div class="hero-art">${mon('Bulbasaur')}${mon('Pikachu')}${mon('Charmander')}</div></section><div class="start-card"><h2>🌟 Prepare-se para jogar!</h2><p class="muted">Escolha um parceiro e invente o nome do seu treinador. Pode jogar sozinho ou em dupla.</p><label style="display:block;font-weight:900;margin-bottom:7px" for="name">Nome do treinador ou da dupla</label><input class="text-input" id="name" value="${safe(s.name)}" placeholder="Ex.: Turma 101 • Ana e Lucas" maxlength="48"><h3 style="margin-top:19px">Escolha seu Pokémon:</h3><div class="partner-list">${['Pikachu','Charmander','Squirtle','Bulbasaur'].map(p=>`<button class="starter ${p===s.partner?'selected':''}" onclick="chooseStarter('${p}')">${mon(p)}${p}</button>`).join('')}</div><p class="banner-note">💡 Pode errar e tentar de novo quantas vezes quiser. Não tem prova nem cronômetro.</p><button class="btn yellow" style="width:100%" onclick="startGame()">🎒 Entrar na aventura!</button></div>`}

"margin:0">Os jogos seguem instruções, guardam informações e fazem escolhas. Você vai descobrir isso brincando!</p></div>${mon(s.partner,'width:93px;height:100px')}</div></div>`}
const walkMaps=[{start:[0,3],goal:[3,3],rocks:[[2,2],[1,1],[4,1]],name:'Primeiro passeio',tip:'Use ➡️ três vezes para alcançar a fruta!'},{start:[0,4],goal:[4,0],rocks:[[1,3],[2,3],[3,3],[2,1]],name:'Contorne as pedras',tip:'As pedras bloqueiam a passagem. Experimente outro caminho.'},{start:[0,0],goal:[4,4],rocks:[[1,1],[2,1],[3,1],[1,3],[2,3],[3,3]],name:'Grande desafio',tip:'Pense em passos pequenos: andar, olhar e decidir o próximo movimento.'}];
function at(a,b){return a[0]===b[0]&&a[1]===b[1]};function isRock(x,y,m){return m.rocks.some(([a,b])=>a===x&&b===y)}
function renderWalk(){const i=Math.min(2,s.walkLevel),m=walkMaps[i];let pos=s.walkPos;if(!Array.isArray(pos)||pos.length!==2)pos=s.walkPos=[...m.start];const done=at(pos,m.goal);return `<div class="levelhead"><div><div class="eyebrow" style="color:#2e9176">BRINCADEIRA 1 DE 5 • ALGORITMO</div><h2>🧭 Passeio Pokémon</h2><p class="muted" style="margin:0">Ensine seu Pokémon a caminhar até a fruta!</p></div><span class="achievement">Mapa ${i+1} de 3</span></div><div class="lesson"><span class="kicker">👀 Entenda brincando</span><p>Seu Pokémon só anda quando <strong>você manda</strong>. Cada seta é uma instrução. Várias instruções em ordem formam um <span class="highlight">algoritmo</span>.</p><div class="example">Exemplo: ➡️ ➡️ ⬇️ significa “andar para a direita, andar de novo e depois descer”.</div></div><div class="gamegrid"><div class="card"><div class="minirow"><h3>🗺️ ${m.name}</h3><span class="counter">👣 ${s.walkSteps} passos</span></div><div class="map" role="group" aria-label="Mapa de 5 por 5 casas">${Array.from({length:25},(_,k)=>{const x=k%5,y=Math.floor(k/5),hero=at([x,y],pos),rock=isRock(x,y,m),goal=at([x,y],m.goal),tr=s.walkTrail.some(c=>at(c,[x,y]));return `<div class="square ${rock?'rock':''} ${goal?'goal':''} ${tr?'trail':''} ${hero?'hero-cell':''}" title="Linha ${y+1}, coluna ${x+1}">${hero?mon(s.partner):rock?'🪨':goal?'🍓':tr?'·':''}</div>`}).join('')}</div><div class="control-pad"><span class="pad-empty"></span><button class="up" onclick="move(0,-1)" aria-label="Andar para cima">⬆️</button><span class="pad-empty"></span><button class="left" onclick="move(-1,0)" aria-label="Andar para esquerda">⬅️</button><button class="down" onclick="move(0,1)" aria-label="Andar para baixo">⬇️</button><button class="right" onclick="move(1,0)" aria-label="Andar para direita">➡️</button></div><p class="center muted" style="font-size:12px">Use as setas ou as teclas do teclado.</p></div><div class="panel"><div class="prompt">🎯 Sua missão: alcance a fruta 🍓 no mapa!</div><div class="bubble">${mon(s.partner)}<div><strong>${s.partner} está esperando!</strong><br><small>Toque em uma seta para mandar ele andar.</small></div></div><div class="note">💡 ${m.tip}</div><div class="feedback ${done?'good':'info'}" id="walk-feedback">${done?'🎉 Você chegou! Seguiu uma sequência de instruções. Isso é um algoritmo!':'👆 Comece clicando em uma das setas. Você pode tentar quantas vezes quiser.'}</div><div class="actionrow"><button class="btn soft sm" onclick="walkRestart()">↻ Recomeçar mapa</button>${done?`<button class="btn green" onclick="nextWalk()">${i<2?'Próximo mapa ➜':'✅ Concluir passeio'}</button>`:''}</div><details class="guide-details"><summary>🤔 O que estou aprendendo?</summary><p>Algoritmo é uma sequência de passos para resolver um problema. No jogo, são os movimentos que levam até a fruta. Fora do jogo, pode ser uma receita ou o caminho até a escola.</p></details></div></div>`}
function move(dx,dy){if(!s.started||s.area!=='walk')return;let i=Math.min(2,s.walkLevel),m=walkMaps[i];if(at(s.walkPos,m.goal))return;let [x,y]=s.walkPos,nx=x+dx,ny=y+dy;const feedback=document.getElementById('walk-feedback');if(nx<0||ny<0||nx>=5||ny>=5||isRock(nx,ny,m)){feedback.className='feedback bad';feedback.innerHTML='🪨 Ops! Aí tem uma pedra ou o fim do mapa. Tente outra seta.';return}s.walkTrail.push([x,y]);s.walkPos=[nx,ny];s.walkSteps++;tick();renderWalkInto();if(at(s.walkPos,m.goal)){win('walk'+i,'Mapa concluído!');renderWalkInto()}}
function renderWalkInto(){document.getElementById('app').innerHTML=renderWalk()}
function walkRestart(){const m=walkMaps[Math.min(2,s.walkLevel)];s.walkPos=[...m.start];s.walkTrail=[];s.walkSteps=0;tick();render()}
function nextWalk(){if(!at(s.walkPos,walkMaps[Math.min(2,s.walkLevel)].goal))return;if(s.walkLevel<2){s.walkLevel++;s.walkPos=[...walkMaps[s.walkLevel].start];s.walkTrail=[];s.walkSteps=0;tick();render()}else{win('walk','Insígnia do caminho conquistada!');go('home')}}
const pokemonNames=Object.keys(P);
function teamTask(){if(s.teamPhase===0)return 'Capture 3 Pokémon diferentes. Clique nos Pokémon à esquerda.';if(s.teamPhase===1)return 'Agora coloque o Pikachu no espaço 1 da equipe.';return 'Último desafio: coloque Squirtle no espaço 3 da equipe.'}
function renderTeam(){return `<div class="levelhead"><div><div class="eyebrow" style="color:#2e9176">BRINCADEIRA 2 DE 5 • VETOR</div><h2>🎒 Monte sua equipe!</h2><p class="muted" style="margin:0">Capture, troque e organize os Pokémon do jeito que quiser.</p></div><span class="achievement">Desafio ${Math.min(s.teamPhase+1,3)} de 3</span></div><div class="lesson"><span class="kicker">👀 Entenda brincando</span><p>Uma equipe é uma <span class="highlight">lista organizada</span>. Na programação, chamamos isso de <strong>vetor</strong>. Cada Pokémon tem um lugar: espaço 1, espaço 2 e espaço 3.</p><div class="example">Exemplo: [Pikachu] [Squirtle] [Eevee] → uma lista com 3 Pokémon. É possível trocar um sem apagar os outros.</div></div><div class="gamegrid"><div class="card"><h3>🌿 Pokémon selvagens — toque para capturar!</h3><div class="monster-grid">${pokemonNames.map(p=>`<button class="monster-card" onclick="catchPokemon('${p}')">${mon(p)}<strong>${p}</strong><small>${P[p].type}</small></button>`).join('')}</div><div class="feedback info" id="team-feedback">🎯 Toque num Pokémon para colocá-lo na equipe. Eles adoram brincar com você!</div></div><div class="panel"><div class="prompt">🎯 ${teamTask()}</div><h3>🎒 Minha equipe</h3><div class="team">${[0,1,2].map(i=>`<button onclick="selectSlot(${i})" class="slot ${s.teamSlot===i?'active':''} ${!s.team[i]?'empty':''}"><span class="slot-label">Espaço ${i+1}</span>${s.team[i]?mon(s.team[i]):'<span>＋</span>'}<b>${s.team[i]||'Vazio'}</b><small>${s.teamSlot===i?'Selecionado':'Toque para escolher'}</small></button>`).join('')}</div><div class="note" style="margin-top:10px">👆 Para trocar: toque no espaço que quer mudar e depois no Pokémon da esquerda.</div><div class="actionrow"><button class="btn soft sm" onclick="teamRemove()">🗑️ Tirar do espaço</button><button class="btn blue sm" onclick="teamClear()">↻ Esvaziar equipe</button></div><div class="feedback ${s.teamPhase>=3?'good':'info'}">${s.teamPhase>=3?'🏆 Parabéns! Você entendeu como funciona uma lista organizada.':'Quando a equipe ficar na ordem certa, o desafio avança automaticamente.'}</div><details class="guide-details"><summary>🤔 O que estou aprendendo?</summary><p>Vetor é como uma fila de espaços. Podemos colocar, consultar e trocar itens usando a posição. Exemplo real: lista de compras, lista de músicas ou equipe Pokémon.</p></details></div></div>`}
function catchPokemon(p){if(s.area!=='team')return;if(s.team.includes(p)&&s.teamSlot===null){setTeamFeedback('ℹ️ Esse Pokémon já está na equipe. Toque em outro para capturar.','info');return}let idx=s.teamSlot!==null?s.teamSlot:[0,1,2].find(i=>!s.team[i]);if(idx===undefined){setTeamFeedback('🎒 Equipe cheia! Toque em um dos três espaços para escolher quem você quer trocar.','bad');return}s.team[idx]=p;s.teamSlot=null;const reward=teamValidate();tick();render();setTeamFeedback(reward||`✨ Você colocou ${p} no espaço ${idx+1}! Experimente trocar os Pokémon.`,'good')}
function setTeamFeedback(msg,kind='info'){let el=document.getElementById('team-feedback');if(el){el.innerHTML=msg;el.className='feedback '+kind}}
function selectSlot(i){s.teamSlot=s.teamSlot===i?null:i;tick();render();setTeamFeedback(s.teamSlot===null?'Você desmarcou o espaço.':'👉 Escolheu o espaço '+(i+1)+'. Agora toque num Pokémon para colocar aqui.','info')}
function teamRemove(){if(s.teamSlot===null){setTeamFeedback('👆 Primeiro toque em um dos espaços da equipe.','bad');return}s.team[s.teamSlot]=null;s.teamSlot=null;tick();render()}
function teamClear(){s.team=[];s.teamSlot=null;tick();render()}
function teamValidate(){if(s.teamPhase===0&&s.team.filter(Boolean).length>=3&&new Set(s.team).size===3){s.teamPhase=1;win('team0','Três Pokémon capturados!');return '⭐ Muito bem! Você formou uma lista de 3 Pokémon. Agora coloque Pikachu no espaço 1.'}if(s.teamPhase===1&&s.team[0]==='Pikachu'){s.teamPhase=2;win('team1','Pikachu está no primeiro espaço!');return '⭐ Excelente! Você mudou a posição de um item. Agora coloque Squirtle no espaço 3.'}if(s.teamPhase===2&&s.team[2]==='Squirtle'){s.teamPhase=3;win('team','Insígnia da equipe conquistada!');return '🏆 Conseguimos! Você organizou um vetor (lista) de Pokémon.'}return ''}
const searches=[{row:2,col:3,name:'Eevee',tip:'Conte as linhas de cima para baixo, depois as colunas da esquerda para a direita.'},{row:4,col:1,name:'Bulbasaur',tip:'Linha 4 é a última linha. Coluna 1 é a primeira casa à esquerda.'},{row:1,col:5,name:'Pikachu',tip:'Linha 1 é a primeira. Coluna 5 é a última casa à direita.'},{row:3,col:4,name:'Jigglypuff',tip:'Ache a linha 3. Depois avance até a coluna 4.'}];
function renderSearch(){const i=Math.min(3,s.searchLevel),q=searches[i],found=s.searchMarks.includes(`${q.row},${q.col}`);return `<div class="levelhead"><div><div class="eyebrow" style="color:#2e9176">BRINCADEIRA 3 DE 5 • MATRIZ</div><h2>🌿 Esconde-esconde Pokémon</h2><p class="muted" style="margin:0">Eles estão escondidos na grama. Use as pistas para encontrar!</p></div><span class="achievement">Busca ${i+1} de 4</span></div><div class="lesson"><span class="kicker">👀 Entenda brincando</span><p>Um mapa tem <strong>linhas</strong> (de lado a lado) e <strong>colunas</strong> (de cima para baixo). Uma tabela com linhas e colunas é uma <span class="highlight">matriz</span>.</p><div class="example">Exemplo: linha 2, coluna 3 → desça até a segunda linha e conte três casas da esquerda para a direita.</div></div><div class="gamegrid"><div class="card"><h3>🗺️ Mapa da grama</h3><div class="grassmap"><div class="axis">↘</div>${[1,2,3,4,5].map(x=>`<div class="axis">C${x}</div>`).join('')}${[1,2,3,4].map(y=>`<div class="axis">L${y}</div>${[1,2,3,4,5].map(x=>{let good=x===q.col&&y===q.row;let seen=s.searchMarks.includes(`${y},${x}`);return `<button aria-label="Linha ${y}, coluna ${x}" title="Linha ${y}, coluna ${x}" class="grass ${seen&&good?'found':seen?'wrong':''}" onclick="look(${y},${x})">${seen&&good?mon(q.name,'width:65px;height:65px'):seen?'🌿':'🌱'}</button>`}).join('')}`).join('')}</div></div><div class="panel"><div class="prompt">🔍 Procure ${q.name} na <strong>linha ${q.row}, coluna ${q.col}</strong>!</div><div class="bubble">${mon(q.name)}<div><strong>${q.name} está brincando de se esconder!</strong><br><small>Leia a pista e clique em uma casa da grama.</small></div></div><div class="note">💡 ${q.tip}</div><div class="feedback ${found?'good':'info'}" id="search-feedback">${found?`🎉 Encontrou ${q.name}! É assim que localizamos uma posição em uma matriz.`:'Toque na casa que corresponde à linha e à coluna da pista.'}</div><div class="actionrow">${found?`<button class="btn green" onclick="nextSearch()">${i===3?'✅ Concluir buscas':'Próximo Pokémon ➜'}</button>`:''}</div><details class="guide-details"><summary>🤔 O que estou aprendendo?</summary><p>Matriz é como uma folha quadriculada. Cada casa tem duas coordenadas: linha e coluna. É usada em jogos, tabuleiros, tabelas e mapas.</p></details></div></div>`}
function look(row,col){if(s.area!=='search')return;const q=searches[Math.min(3,s.searchLevel)];if(s.searchMarks.includes(`${q.row},${q.col}`))return;s.searchMarks.push(`${row},${col}`);let correct=row===q.row&&col===q.col;if(correct){win('search'+s.searchLevel,`${q.name} encontrado!`);tick();render()}else{tick();render();const el=document.getElementById('search-feedback');el.innerHTML=`🌿 Você abriu <strong>linha ${row}, coluna ${col}</strong>. Mas a pista pede <strong>linha ${q.row}, coluna ${q.col}</strong>. Tente de novo!`;el.className='feedback bad'}}
function nextSearch(){const q=searches[Math.min(3,s.searchLevel)];if(!s.searchMarks.includes(`${q.row},${q.col}`))return;if(s.searchLevel<3){s.searchLevel++;s.searchMarks=[];tick();render()}else{win('search','Insígnia do mapa conquistada!');go('home')}}
const battles=[{title:'Primeiro ataque',instruction:'Faça um ataque que devolva pelo menos 4 pontos de dano.',complete:'min4',enemy:'Eevee'},{title:'Ataque certinho',instruction:'Agora descubra uma combinação que devolva exatamente 7 pontos de dano.',complete:'exact7',enemy:'Jigglypuff'},{title:'Batalha amistosa',instruction:'Derrote o Pokémon adversário! Ele tem 10 pontos de energia. Pode atacar várias vezes.',complete:'win10',enemy:'Bulbasaur'}];
function renderBattle(){const i=Math.min(2,s.battleLevel),q=battles[i];return `<div class="levelhead"><div><div class="eyebrow" style="color:#2e9176">BRINCADEIRA 4 DE 5 • FUNÇÃO</div><h2>⚡ Arena dos ataques</h2><p class="muted" style="margin:0">Escolha os números e veja o que o ataque devolve!</p></div><span class="achievement">Batalha ${i+1} de 3</span></div><div class="lesson"><span class="kicker">👀 Entenda brincando</span><p>Imagine uma <strong>máquina de ataques</strong>: você coloca a força e um bônus, ela calcula e <strong>devolve um resultado</strong>. Na programação, isso lembra uma <span class="highlight">função</span>.</p><div class="example">Exemplo: força 3 + bônus 2 = 5 de dano. A máquina recebeu 3 e 2, e devolveu 5.</div></div><div class="gamegrid"><div class="card"><div class="battle"><div class="battler">${mon(s.partner)}<strong>${s.partner} • Seu parceiro</strong></div><div class="battler">${mon(q.enemy)}<strong>${q.enemy}</strong><div class="hp"><span style="width:${Math.max(0,s.hp)/10*100}%"></span></div><small>Energia: ${Math.max(0,s.hp)}/10</small></div></div><div class="equation"><span class="num">${s.power}</span><strong>+</strong><span class="num">${s.bonus}</span><strong>=</strong><span class="num output">${s.power+s.bonus}</span></div><p class="center muted" style="font-size:13px">Força + Bônus = Resultado do ataque</p></div><div class="panel"><div class="prompt">🎯 ${q.instruction}</div><h3>1. Escolha a força</h3><div class="choices">${[1,2,3,4,5].map(v=>`<button class="choice ${s.power===v?'selected':''}" onclick="choosePower(${v})">${v}</button>`).join('')}</div><h3 style="margin-top:14px">2. Escolha o bônus</h3><div class="choices">${[0,2,4].map(v=>`<button class="choice ${s.bonus===v?'selected':''}" onclick="chooseBonus(${v})">+${v}</button>`).join('')}</div><div class="actionrow"><button class="btn yellow" onclick="attack()">⚡ Atacar!</button><button class="btn soft sm" onclick="resetBattle()">↻ Reiniciar batalha</button></div><div class="feedback ${s.battleHit===-1?'good':'info'}" id="battle-feedback">${s.battleHit===-1?'🎉 Desafio completo! Você descobriu o resultado da função.':'Aperte <strong>Atacar!</strong>. Observe o número que a função devolve.'}</div>${s.battleHit===-1?`<button class="btn green" style="margin-top:13px" onclick="nextBattle()">${i===2?'✅ Concluir arena':'Próximo desafio ➜'}</button>`:''}<details class="guide-details"><summary>🤔 O que estou aprendendo?</summary><p>Uma função recebe informações, faz um cálculo ou tarefa e devolve um resultado. Aqui ela soma a força ao bônus para produzir o dano do ataque.</p></details></div></div>`}
function choosePower(n){s.power=n;tick();render()}function chooseBonus(n){s.bonus=n;tick();render()}function resetBattle(){s.hp=10;s.battleHit=0;tick();render()}
function attack(){let i=Math.min(2,s.battleLevel),q=battles[i],d=s.power+s.bonus;if(s.battleHit===-1)return;let passed=q.complete==='min4'?d>=4:q.complete==='exact7'?d===7:(s.hp=Math.max(0,s.hp-d))===0;s.battleHit++;if(passed){win('battle'+i,'Ataque do desafio concluído!');s.battleHit=-1;tick();render();document.getElementById('battle-feedback').className='feedback good';document.getElementById('battle-feedback').innerHTML=`🎉 A função recebeu ${s.power} e ${s.bonus} e devolveu ${d}! ${i===2?'Você venceu a batalha amistosa!':'Boa descoberta!'}`;}else{tick();render();let el=document.getElementById('battle-feedback');el.className='feedback bad';el.innerHTML=q.complete==='min4'?`⚡ Devolveu ${d}. Precisamos de pelo menos 4. Aumente a força ou o bônus e tente!`:q.complete==='exact7'?`⚡ Devolveu ${d}. O objetivo é exatamente 7. Experimente outros números!`:`⚡ Devolveu ${d}! O adversário ficou com ${s.hp} pontos. Ataque novamente!`}}
function nextBattle(){if(s.battleHit!==-1)return;if(s.battleLevel<2){s.battleLevel++;s.hp=10;s.battleHit=0;tick();render()}else{win('battle','Insígnia da arena conquistada!');go('home')}}
const careRounds=[{name:'Uma pausa para beber água',steps:['water'],tip:'Comece clicando no botão Dar água.'},{name:'Hora do lanche',steps:['water','food'],tip:'Primeiro dê água. Depois, ofereça uma fruta.'},{name:'Tratamento completo',steps:['water','food','heal'],tip:'Faça as três ações na ordem: água, fruta e curar.'}];const careNames={water:'💧 Dar água',food:'🍎 Dar fruta',heal:'💚 Curar'};
function renderCare(){const i=Math.min(2,s.careLevel),r=careRounds[i],done=s.careStep>=r.steps.length;return `<div class="levelhead"><div><div class="eyebrow" style="color:#2e9176">BRINCADEIRA 5 DE 5 • PROCEDIMENTO</div><h2>💚 Centro Pokémon</h2><p class="muted" style="margin:0">Seu Pokémon voltou cansado. Vamos cuidar dele?</p></div><span class="achievement">Cuidado ${i+1} de 3</span></div><div class="lesson"><span class="kicker">👀 Entenda brincando</span><p>Quando você aperta <strong>Dar água</strong>, o Pokémon bebe água. Isso é uma <span class="highlight">ação</span>. Na programação, um <strong>procedimento</strong> reúne instruções para realizar uma ação, sem precisar devolver um resultado.</p><div class="example">Diferença: na arena a função <strong>devolve um número</strong>. Aqui o procedimento <strong>faz uma ação</strong> para cuidar do Pokémon.</div></div><div class="gamegrid"><div class="card"><div class="center-mon ${done?'happy':''}">${mon(s.partner)}</div><div class="center"><h3>${s.partner} ${done?'está feliz! 🎉':'precisa de cuidados 🥺'}</h3><p class="muted">${done?'Você completou a rotina!':'Cada botão executa um cuidado diferente.'}</p></div><div class="actions-three">${[['water','💧','Dar água'],['food','🍎','Dar fruta'],['heal','💚','Curar']].map(([id,emoji,title])=>`<button onclick="careAction('${id}')"><span>${emoji}</span>${title}</button>`).join('')}</div></div><div class="panel"><div class="prompt">🎯 ${r.name}: ${r.steps.map(k=>careNames[k]).join(' → ')}</div><h3>✅ Passo a passo</h3>${r.steps.map((k,j)=>`<div style="padding:9px 0;border-bottom:1px solid #e5eeea;font-weight:850;color:${j<s.careStep?'#1b8c55':'#657c73'}">${j<s.careStep?'✅':j===s.careStep?'👆':'◯'} ${j+1}. ${careNames[k]}</div>`).join('')}<div class="note">💡 ${r.tip}</div><div class="feedback ${done?'good':'info'}" id="care-feedback">${done?'🎉 Você cuidou muito bem do seu Pokémon!':'Toque nos botões na ordem mostrada. Cada botão executa um procedimento.'}</div><div class="actionrow"><button class="btn soft sm" onclick="resetCare()">↻ Recomeçar cuidados</button>${done?`<button class="btn green" onclick="nextCare()">${i===2?'✅ Concluir centro':'Próximo cuidado ➜'}</button>`:''}</div><details class="guide-details"><summary>🤔 O que estou aprendendo?</summary><p>Um procedimento é um conjunto de passos usado para executar uma ação: dar água, mostrar uma mensagem, curar um Pokémon. Ao contrário da função deste jogo, ele não precisa devolver um valor calculado.</p></details></div></div>`}
function careAction(k){if(s.area!=='care')return;const r=careRounds[Math.min(2,s.careLevel)];if(s.careStep>=r.steps.length)return;if(k!==r.steps[s.careStep]){let el=document.getElementById('care-feedback');el.className='feedback bad';el.innerHTML=`🙂 Essa ação também cuida do Pokémon, mas agora o próximo passo é: <strong>${careNames[r.steps[s.careStep]]}</strong>. Tente esse botão!`;return}s.careStep++;s.careTotal++;tick();render();let el=document.getElementById('care-feedback');if(s.careStep===r.steps.length){win('care'+s.careLevel,'Rotina de cuidados concluída!');el.innerHTML='🎉 Você executou todas as ações na ordem correta!';el.className='feedback good'}else{el.innerHTML=`💚 Muito bem! Você executou um procedimento. Agora faça: <strong>${careNames[r.steps[s.careStep]]}</strong>.`;el.className='feedback good'}}
function resetCare(){s.careStep=0;tick();render()}function nextCare(){const r=careRounds[Math.min(2,s.careLevel)];if(s.careStep<r.steps.length)return;if(s.careLevel<2){s.careLevel++;s.careStep=0;tick();render()}else{win('care','Insígnia de cuidador conquistada!');go('album')}}

function acadInit(){if(!s.academy||typeof s.academy!=='object')s.academy={};const a=s.academy;a.level=Number.isInteger(a.level)?Math.max(0,Math.min(5,a.level)):0;a.queues=Array.isArray(a.queues)?a.queues:[[],[],[],[],[],[]];a.ptPassed=Array.isArray(a.ptPassed)?a.ptPassed:[];a.jsPassed=Array.isArray(a.jsPassed)?a.jsPassed:[];a.drafts=Array.isArray(a.drafts)?a.drafts:[];a.last=typeof a.last==='object'&&a.last?a.last:{};return a}
function academyLevel(n){const a=acadInit();a.level=Math.max(0,Math.min(5,n));a.last={};tick();render();window.scrollTo({top:0,behavior:'smooth'})}
function academyCommand(k){const a=acadInit(),i=a.level;if(a.queues[i].length>17){toast('No máximo 18 comandos. Apague alguns!');return}a.queues[i].push(k);a.last={};tick();render()}
function academyUndo(){const a=acadInit();a.queues[a.level].pop();a.last={};tick();render()}
function academyResetPt(){const a=acadInit();a.queues[a.level]=[];a.last={};tick();render()}
function acadWalk(queue){let x=0,y=2,trail=[[0,2]],bump='';for(const cmd of queue){let [dx,dy]=({direita:[1,0],esquerda:[-1,0],cima:[0,-1],baixo:[0,1]})[cmd]||[0,0];let xx=x+dx,yy=y+dy;if(xx<0||xx>3||yy<0||yy>2||((xx===1||xx===2)&&yy===1)){bump='Você tentou passar por uma pedra ou sair do mapa.';break}x=xx;y=yy;trail.push([x,y])}return {success:x===3&&y===0&&!bump,x,y,trail,message:bump||((x===3&&y===0)?'Chegou à fruta!':'Seu Pokémon ainda não chegou à fruta.')}}
const academyExpected=[null,['if','else'],['push'],['1-2'],['input','sum','return'],['water','food','heal']];
function academyTestPt(){const a=acadInit(),i=a.level,q=a.queues[i];let ok=false,result={};if(i===0){result=acadWalk(q);ok=result.success}else ok=JSON.stringify(q)===JSON.stringify(academyExpected[i]);if(ok){a.ptPassed[i]=true;if(!a.drafts[i])a.drafts[i]=academyUnits[i].starter;a.last={kind:'pt',ok:true,message:'Muito bem! Você montou a lógica em português. Agora veja como fica em JavaScript.',result};}else{const hints=['Tente: 3 passos para a direita e 2 para cima, nessa ordem.','Use SE primeiro e SENÃO depois.','Você deve apenas adicionar Eevee no fim.','Lembre-se de que 1 é a segunda linha e 2 é a terceira coluna.','Receber, somar, devolver: são três passos nessa ordem.','Cuide assim: água, comida e cura.'];a.last={kind:'pt',ok:false,message:result.message&&i===0?result.message+' '+hints[i]:hints[i],result};}tick();render()}
function academyDraftChange(value){const a=acadInit();a.drafts[a.level]=value;save()}
function academyInsert(text){const el=document.getElementById('academy-code');if(!el)return;const i=acadInit().level;let v=el.value;
if(i===1 && v.includes('// Escreva o aviso aqui'))v=v.replace('// Escreva o aviso aqui',text);

el.value=v;academyDraftChange(v);el.focus();el.setSelectionRange(el.value.length,el.value.length)}

<div class="gamegrid"><section class="card"><div class="acad-section-heading"><span class="acad-stepnum">1</span><div><h3>Comande em português</h3><p class="muted">Clique nas ações na ordem correta. Depois use o botão Testar.</p></div></div><div class="prompt">🎯 Sua missão: ${u.pt}</div><div class="acad-buttons">${u.buttons.map(([label,k])=>`<button class="btn soft" onclick="academyCommand('${k}')">${label}</button>`).join('')}</div><h3 class="acad-queue-label">Suas instruções:</h3><div class="acad-queue">${queue.length?queue.map((c,j)=>`<span><b>${j+1}</b> ${safe(u.buttons.find(x=>x[1]===c)?.[0]||c)}</span>`).join(''):'<em>Toque nos comandos acima para montar sua sequência…</em>'}</div><div class="actionrow"><button class="btn green" onclick="academyTestPt()" ${queue.length?'':'disabled'}>▶ Testar em português</button><button class="btn soft sm" onclick="academyUndo()">↶ Desfazer</button><button class="btn soft sm" onclick="academyResetPt()">↻ Limpar</button></div>${a.last?.kind==='pt'?`<div class="feedback ${a.last.ok?'good':'bad'}" role="status">${safe(fb)}</div>`:''}<details class="guide-details"><summary>💡 Preciso de uma dica</summary><p>${safe(u.pt)}</p></details></section>
<section class="panel"><h3>👀 Observe seu Pokémon</h3>${academyScene(i, res)}<div class="note">${i===0?'O Pokémon começa na parte de baixo à esquerda. O objetivo é a fruta 🍓, evitando as pedras.':i===1?'O programa deve funcionar com e sem Pokébola.':i===2?'Um vetor é uma lista. Observe os índices 0, 1 e 2.':i===3?'Uma matriz parece um tabuleiro. A linha 1 e a coluna 2 são a casa destacada.':i===4?'Uma função devolve uma resposta para cada combinação de força e bônus.':'Um procedimento executa várias ações, na ordem escolhida.'}</div></section></div>
${pass?`<div class="card academy-code-card" id="academy-code-section"><div class="acad-section-heading"><span class="acad-stepnum">2</span><div><h3>Agora é JavaScript de verdade!</h3><p class="muted">Você já entendeu em português. Veja como o computador recebe essas instruções.</p></div></div><div class="acad-bridge"><div><small>🗣️ EM PORTUGUÊS</small><p>${safe(u.pt)}</p></div><span class="acad-equals">➜</span><div><small>💻 EM JAVASCRIPT</small><code>${safe(u.example)}</code></div></div><div class="acad-dictionary">${u.explain.map(([k,v])=>`<div><code>${safe(k)}</code><span>${safe(v)}</span></div>`).join('')}</div><p class="acad-instruction">✍️ <b>Seu desafio:</b> complete ou corrija o código abaixo. Use “Inserir comando” se precisar. Depois clique em Executar e veja o que aconteceu com o Pokémon.</p><label for="academy-code" class="acad-editor-label">Editor JavaScript</label><textarea id="academy-code" class="acad-editor" rows="${Math.max(5,u.starter.split('\n').length+1)}" spellcheck="false" oninput="academyDraftChange(this.value)">${safe(a.drafts[i]??u.starter)}</textarea><div class="actionrow"><button class="btn yellow" onclick="academyRunJS()">▶ Executar JavaScript</button><button class="btn blue" onclick="academyInsert(${JSON.stringify(u.insert).replaceAll('"','&quot;')})">➕ Inserir comando</button><button class="btn soft sm" onclick="academyExample()">👀 Mostrar exemplo resolvido</button></div><details class="guide-details"><summary>💡 Mostrar dica de programação</summary><p>${safe(u.hint)}</p></details>${a.last?.kind==='code'?`<div class="feedback ${a.last.ok?'good':a.last.pending?'info':'bad'}" id="academy-js-feedback" role="status">${safe(a.last.message)}</div>`:'<div class="feedback info" id="academy-js-feedback">Seu código ainda não foi executado. Experimente mudar alguma linha e observar a diferença.</div>'}${finished?`<div class="acad-success"><span>🏅</span><div><b>Missão concluída!</b><p>${safe(u.win)} ${safe(u.next)}</p></div></div><div class="actionrow">${i<5?`<button class="btn green" onclick="academyLevel(${i+1})">Próxima aula ➜</button>`:`<button class="btn green" onclick="go('album')">🏆 Ver meu álbum</button>`}<button class="btn blue" onclick="go('${['walk','walk','team','search','battle','care'][i]}')">🎮 Jogar a brincadeira relacionada</button></div>`:''}</div>`:`<div class="card academy-locked"><div class="acad-section-heading"><span class="acad-stepnum">2</span><div><h3>Seu primeiro código vem em seguida!</h3><p>Complete a parte em português acima para desbloquear o editor de JavaScript. Você não vai precisar decorar nada.</p></div></div></div>`}
<div class="card" style="margin-top:16px"><h3>🎯 Continue aprendendo</h3><p class="muted">Além da aula de programação, as cinco brincadeiras originais continuam disponíveis. Você pode praticar com setas, capturas, mapas, batalhas e cuidados Pokémon.</p><button class="btn blue" onclick="go('home')">🎮 Voltar às brincadeiras Pokémon</button></div>`}
const academyRunnerSource=`window.addEventListener('message',function(event){
 const data=event.data||{};if(data.type!=='academy-run')return;
 const reply=(payload)=>parent.postMessage({type:'academy-result',token:data.token,...payload},'*');
 try{
  const code=String(data.code||'');if(code.length>2500)throw Error('O programa está grande demais. Use apenas os comandos da aula.');
  if(/\\b(?:while|for|do|eval|Function|fetch|XMLHttpRequest|import|window|document|location|parent|globalThis|setTimeout|setInterval)\\b/.test(code))throw Error('Use somente os comandos ensinados nesta aula. Ainda não precisamos desses outros recursos.');
  let result={success:false,reason:'Tente novamente.'};const run=new Function;
  if(data.level===0){let x=0,y=2,steps=0,blocked=false,trail=[[0,2]];const mover=function(dir){if(++steps>18)throw Error('Máximo de 18 passos por tentativa.');let d=({direita:[1,0],esquerda:[-1,0],cima:[0,-1],baixo:[0,1]})[dir];if(!d)throw Error('Direção desconhecida. Use direita, esquerda, cima ou baixo.');let xx=x+d[0],yy=y+d[1];if(xx<0||xx>3||yy<0||yy>2||(yy===1&&(xx===1||xx===2))){blocked=true;throw Error('Seu Pokémon bateu em uma pedra ou saiu do mapa.');}x=xx;y=yy;trail.push([x,y]);};new Function('mover','"use strict";\\n'+code)(mover);result={success:x===3&&y===0&&!blocked,trail,reason:x===3&&y===0?'':'Seu Pokémon não chegou à fruta. Confira as direções.'};}
  else if(data.level===1){let successes=[];for(const ball of [true,false]){let catches=0,alerts=[];const capturar=()=>{catches++};const avisar=m=>alerts.push(String(m));new Function('temPokebola','capturar','avisar','"use strict";\\n'+code)(ball,capturar,avisar);successes.push({ball,catches,alerts});}result={success:successes[0].catches===1&&successes[0].alerts.length===0&&successes[1].catches===0&&successes[1].alerts.includes('Sem Pokébolas!'),haveBall:successes[0].catches?'Pokémon capturado!':'não capturou',noBall:successes[1].alerts.join(', ')||'não avisou',reason:'Teste as duas situações: tendo Pokébola e não tendo Pokébola.'};}
  else if(data.level===2){let equipe=['Pikachu','Squirtle'];new Function('equipe','"use strict";\\n'+code)(equipe);result={success:JSON.stringify(equipe)===JSON.stringify(['Pikachu','Squirtle','Eevee']),team:equipe.slice(0,8),reason:'A equipe precisa ficar: Pikachu, Squirtle e Eevee, nessa ordem.'};}
  else if(data.level===3){let mapa=[['🌿','🌿','🌿'],['🌿','🌿','🌿'],['🌿','🌿','🌿']];new Function('mapa','"use strict";\\n'+code)(mapa);result={success:mapa[1]?.[2]==='Bulbasaur'&&mapa.flat().filter(k=>k==='Bulbasaur').length===1,map:mapa,reason:'Use mapa[1][2] para a segunda linha e terceira coluna.'};}
  else if(data.level===4){let values=new Function('"use strict";\\n'+code+'\\nreturn [calcularDano(2,1),calcularDano(4,2),calcularDano(1,0)];')();result={success:JSON.stringify(values)===JSON.stringify([3,6,1]),damages:values,reason:'A função deve SOMAR força e bônus e devolver o resultado com return.'};}
  else if(data.level===5){let actions=[];const darAgua=()=>actions.push('water'),darComida=()=>actions.push('food'),curar=()=>actions.push('heal');new Function('darAgua','darComida','curar','"use strict";\\n'+code+'\\ncuidar();')(darAgua,darComida,curar);result={success:JSON.stringify(actions)===JSON.stringify(['water','food','heal']),actions,reason:'O procedimento precisa dar água, dar comida e curar, nessa ordem.'};}
  reply({ok:true,result});
 }catch(err){reply({ok:false,error:String(err&&err.message||err)})}
});`;
let academyPending=null,academyIframe=null,academySeq=0;
function academyEnsureFrame(){if(academyIframe){academyIframe.remove();academyIframe=null}const iframe=document.createElement('iframe');iframe.hidden=true;iframe.setAttribute('sandbox','allow-scripts');iframe.setAttribute('title','Área isolada de teste de JavaScript');iframe.srcdoc='<html><head><meta charset="utf-8"></head><body><scr'+'ipt>'+academyRunnerSource+'</scr'+'ipt></body></html>';document.body.appendChild(iframe);academyIframe=iframe;return iframe}
window.addEventListener('message',function(ev){if(!academyPending||!academyIframe||ev.source!==academyIframe.contentWindow||!ev.data||ev.data.type!=='academy-result'||ev.data.token!==academyPending.token)return;const p=academyPending;academyPending=null;p.resolve(ev.data)});
async function academyExecute(level,code){const iframe=academyEnsureFrame(),token='p'+(++academySeq);const answer=new Promise(resolve=>academyPending={token,resolve});await new Promise(resolve=>{iframe.addEventListener('load',resolve,{once:true});setTimeout(resolve,250)});iframe.contentWindow.postMessage({type:'academy-run',token,level,code},'*');return await Promise.race([answer,new Promise(resolve=>setTimeout(()=>resolve({ok:false,error:'A execução demorou demais. Reinicie sua tentativa.'}),3500))])}
async function academyRunJS(){const a=acadInit(),i=a.level,el=document.getElementById('academy-code');if(!el||!a.ptPassed[i])return;a.drafts[i]=el.value;a.last={kind:'code',pending:true,ok:false,message:'Executando seu JavaScript em uma área isolada…'};tick();const status=document.getElementById('academy-js-feedback');if(status){status.className='feedback info';status.textContent=a.last.message;}const output=await academyExecute(i,a.drafts[i]);if(!output.ok){a.last={kind:'code',ok:false,message:'Seu código ainda precisa de um ajuste: '+(output.error||'Erro desconhecido')+'. Veja a dica e tente novamente.'}}else if(output.result.success){a.jsPassed[i]=true;a.last={kind:'code',ok:true,message:academyUnits[i].win,result:output.result};win('academy'+i,'Aula de JavaScript concluída!')}else{a.last={kind:'code',ok:false,message:output.result.reason||'O resultado não foi o esperado. Tente alterar as instruções.',result:output.result}}tick();render();const target=document.getElementById('academy-code-section');if(target)target.scrollIntoView({behavior:'smooth',block:'start'})}

document.addEventListener('keydown',e=>{if(s.area!=='walk'||!s.started||['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;let dict={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};if(dict[e.key]){e.preventDefault();move(...dict[e.key])}});
render();
</script>
</body>
</html>
